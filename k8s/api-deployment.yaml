apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: course
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/chamalka001/turiba-devops-labs/api:7e4f231f5f5b261856f7b42693b5e8a78e9a686e
          ports:
            - containerPort: 5000
