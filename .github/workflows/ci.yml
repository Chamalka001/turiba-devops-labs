# Lab 5 · the starter for your CI pipeline.
#
#   mkdir -p .github/workflows
#   cp lab05-ci-pipeline/ci.start.yml .github/workflows/ci.yml
#
# Then fill in every blank in .github/workflows/ci.yml (11 decisions, B1–B11).
# Each blank names the slide that explains it. Stuck? The guide has three hints
# per blank (Part 2, step 4): 🔎 Look → 💡 Think → 🛠 Fix.
# Don't rename the jobs: lint, unit, integration and image become required checks.
# The lines without a blank are given: read their comments, but leave them as they are.
name: ci

on:
  push:
    branches: [main]                                # B1: which branch gets push runs? (slide 9)
  pull_request:
    branches: [main]

permissions:
  contents: read                                    # every job reads the code, nothing more (slide 23)

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Lint
        run: npm run lint                           # B2: the npm script that runs ESLint (slide 18)

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Unit tests (no database)
        run: npm test                               # B3: the npm script for the small tests (slide 17)

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:                                           # the label; Compose calls it the service name
        image: postgres:17-alpine                                 # B4: the same image as db in your compose.yaml (slide 19)
        env:
          POSTGRES_USER: todo
          POSTGRES_DB: todo
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}    # B6: the name of your repository secret (slide 23)
        ports:
          - 5432:5432                               # given: the steps run on the runner, so they need a published port
        options: >-
          --health-cmd "pg_isready -h localhost -U todo -d todo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        # given: with a health check, the runner waits until db is healthy before the first step (slide 19)
    env:                                            # what the API and the test read (api/.env.example)
      DB_HOST: localhost                                 # B5: localhost or db? Where do these steps run? (slide 20)
      DB_PORT: 5432
      DB_USER: todo
      DB_NAME: todo
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}              # B6 again: the same secret
      PORT: 5000
      API_URL: http://localhost:5000
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Start the API from source (not the image)
        run: node server.js > server.log 2>&1 &      # given: & = in the background; the output goes to a file (slide 21)
      - name: Wait until the API answers from the database
        run: >-
          curl --silent --show-error --fail
          --retry 30 --retry-delay 1 --retry-all-errors
          "$API_URL/api/todos"                           # B7: the path that answers 200 only when the database works (slide 21)
      - name: Integration tests
        run: npm run test:integration
      - name: "On failure: the API log"
        if: failure()                                  # B8: run this step only when an earlier step failed (slide 15)
        run: cat server.log
      - name: "On failure: the database log"
        if: failure()                                  # B8 again
        run: docker logs "${{ job.services.db.id }}"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image
    needs: [lint, unit, integration]                                   # B9: which jobs must pass before the image is built? (slide 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                                # B10: read or write? This job pushes to GHCR (slide 23)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name in lowercase
        # given: Docker refuses capitals, and ${GITHUB_REPOSITORY,,} is bash for "in lowercase" (slide 24)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0           # given: lets the runner build arm64 images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for the smoke test (amd64, kept on the runner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE:${{ github.sha }}"
          if ! curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:5000/; then
            echo "::error::The image did not answer GET /. Its log:"
            docker logs smoke
            exit 1
          fi
      - name: Trivy scan (fails on CRITICAL with a fix)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build, and push from main only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          # given: two platforms and a push only on main; a PR only builds amd64 (slide 24)
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}        # B11: the commit this run builds, as a tag (slide 24)
